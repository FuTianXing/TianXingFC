  <div class="top">
    <h1>三副面孔 · 元相子</h1>
    <p>网络里的量子神经元　双通道状态空间 · 积分发放 · 权重与传递</p>
  </div>

  <div class="svgbox">
  <svg xmlns="http://www.w3.org/2000/svg" width="1680" height="2180" viewBox="0 0 1680 2180" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif">
    <defs>
      <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
        <path d="M 56 0 L 0 0 0 56" fill="none" stroke="rgba(148,163,184,0.05)" stroke-width="1"/>
      </pattern>
      <filter id="bg" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="60"/></filter>
      <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
        <path d="M 0 0 L 10 5 L 0 10 z" fill="#38bdf8"/>
      </marker>
    </defs>

    <rect width="1680" height="2180" fill="#0a0e1a"/>
    <circle cx="320" cy="260" r="520" fill="#2a1f0a" opacity="0.45" filter="url(#bg)"/>
    <circle cx="1400" cy="1300" r="520" fill="#0f2a24" opacity="0.4" filter="url(#bg)"/>
    <rect width="1680" height="2180" fill="url(#grid)"/>

    <text x="840" y="88" font-size="50" fill="#f8fafc" font-weight="800" text-anchor="middle" letter-spacing="8">三副面孔 · 元相子</text>
    <text x="840" y="136" font-size="21" fill="#94a3b8" text-anchor="middle" letter-spacing="3">网络里的量子神经元　双通道状态空间 · 积分发放 · 权重与传递</text>
    <line x1="520" y1="168" x2="1160" y2="168" stroke="rgba(245,197,66,0.35)" stroke-width="2" stroke-linecap="round"/>

    <!-- 1 双通道状态空间 -->
    <circle cx="150" cy="248" r="22" fill="none" stroke="#38bdf8" stroke-width="2.5"/>
    <text x="150" y="256" font-size="22" fill="#38bdf8" font-weight="700" text-anchor="middle">1</text>
    <text x="196" y="238" font-size="25" fill="#e5e7eb" font-weight="700">双通道状态空间</text>
    <text x="196" y="264" font-size="14" fill="#94a3b8">物侧态空间由两个通道张成　H_k = L²(S¹) ⊗ ℓ²(ℤ)</text>

    <rect x="150" y="306" width="660" height="300" rx="14" fill="rgba(245,197,66,0.05)" stroke="rgba(245,197,66,0.30)" stroke-width="1.5"/>
    <text x="180" y="348" font-size="21" fill="#f5c542" font-weight="700">相位通道 L²(S¹)</text>
    <text x="180" y="374" font-size="13" fill="#94a3b8">横向 · 连续 · 内部空间 · 读数非定域</text>
    <circle cx="340" cy="486" r="52" fill="none" stroke="#f5c542" stroke-width="2.4"/>
    <circle cx="340" cy="486" r="40" fill="none" stroke="rgba(245,197,66,0.25)" stroke-width="1" stroke-dasharray="4 5"/>
    <line x1="340" y1="486" x2="340" y2="434" stroke="rgba(148,163,184,0.35)" stroke-width="1" stroke-dasharray="4 4"/>
    <line x1="288" y1="486" x2="392" y2="486" stroke="rgba(148,163,184,0.35)" stroke-width="1" stroke-dasharray="4 4"/>
    <line x1="340" y1="486" x2="374" y2="452" stroke="#f5c542" stroke-width="3" stroke-linecap="round"/>
    <circle cx="340" cy="486" r="4" fill="#f8fafc"/>
    <text x="386" y="446" font-size="13" fill="#f5c542" font-weight="700">θ</text>
    <text x="520" y="480" font-size="14" fill="#cbd5e1">相位指针在单位圆上匀速旋转</text>
    <text x="520" y="504" font-size="13.5" fill="#94a3b8">θ 随时间线性推进，转一圈回到原位</text>
    <text x="520" y="528" font-size="13.5" fill="#94a3b8">读数非定域：只问相对相位，不问绝对角度</text>

    <rect x="870" y="306" width="660" height="300" rx="14" fill="rgba(52,211,153,0.05)" stroke="rgba(52,211,153,0.30)" stroke-width="1.5"/>
    <text x="900" y="348" font-size="21" fill="#34d399" font-weight="700">层数通道 ℓ²(ℤ)</text>
    <text x="900" y="374" font-size="13" fill="#94a3b8">纵向 · 离散 · 外部空间 · 基本读数定域</text>
    <g stroke="#34d399" stroke-width="3" stroke-linecap="round">
      <line x1="1000" y1="438" x2="1080" y2="438"/>
      <line x1="1000" y1="470" x2="1080" y2="470"/>
      <line x1="1000" y1="502" x2="1080" y2="502"/>
      <line x1="1000" y1="534" x2="1080" y2="534"/>
    </g>
    <g font-size="13" fill="#94a3b8">
      <text x="1092" y="443">|3〉</text><text x="1092" y="475">|2〉</text>
      <text x="1092" y="507">|1〉</text><text x="1092" y="539">|0〉</text>
    </g>
    <text x="1150" y="470" font-size="14" fill="#cbd5e1">每满周一次，层数计数加一</text>
    <text x="1150" y="494" font-size="13.5" fill="#94a3b8">层数累积给出距离（距离归粒）</text>
    <text x="1150" y="518" font-size="13.5" fill="#94a3b8">基矢 |n〉对应第 n 次满周事件</text>

    <text x="840" y="654" font-size="16" fill="#f8fafc" font-weight="600" text-anchor="middle">两通道正交，度规可分离 ds² = dφ² + dz²；横向归波与方向，纵向归粒与距离</text>
    <line x1="300" y1="690" x2="1380" y2="690" stroke="rgba(245,197,66,0.35)" stroke-width="1.5" stroke-dasharray="6 6"/>

    <!-- 2 积分与发放 -->
    <circle cx="150" cy="752" r="22" fill="none" stroke="#34d399" stroke-width="2.5"/>
    <text x="150" y="760" font-size="22" fill="#34d399" font-weight="700" text-anchor="middle">2</text>
    <text x="196" y="742" font-size="25" fill="#e5e7eb" font-weight="700">积分与发放：一次事件的三步</text>
    <text x="196" y="768" font-size="14" fill="#94a3b8">旋转连续，跃迁离散，临界点由相位标记点给出</text>

    <rect x="150" y="808" width="1380" height="372" rx="14" fill="rgba(17,24,39,0.55)" stroke="rgba(148,163,184,0.20)" stroke-width="1.5"/>
    <line x1="240" y1="1054" x2="1440" y2="1054" stroke="rgba(148,163,184,0.35)" stroke-width="1.4"/>
    <line x1="240" y1="978" x2="1440" y2="978" stroke="rgba(52,211,153,0.5)" stroke-width="1.4" stroke-dasharray="6 5"/>
    <text x="1444" y="974" font-size="12" fill="#94a3b8">阈值 θ = 2πn</text>
    <polyline points="240,1054 900,978" fill="none" stroke="#38bdf8" stroke-width="3.4" stroke-linejoin="round"/>
    <line x1="900" y1="978" x2="900" y2="912" stroke="#34d399" stroke-width="3.4"/>
    <circle cx="900" cy="912" r="6" fill="#34d399" class="pulse"/>
    <text x="330" y="908" font-size="14.5" fill="#38bdf8" font-weight="700">积分（连续）</text>
    <text x="600" y="932" font-size="13" fill="#94a3b8">相位角 θ 连续推进</text>
    <text x="912" y="906" font-size="14.5" fill="#34d399" font-weight="700">发放（离散）</text>
    <text x="912" y="930" font-size="13" fill="#94a3b8">法线跃迁 l_P</text>
    <text x="240" y="1102" font-size="14.5" fill="#cbd5e1">① 累积：相位指针匀速旋转，θ 从物理实轴出发单调增长</text>
    <text x="240" y="1130" font-size="14.5" fill="#cbd5e1">② 触发：θ = 2πn（满周闭合）被精确触发，无随机性</text>
    <text x="240" y="1158" font-size="14.5" fill="#cbd5e1">③ 发放：沿法线平移一个普朗克长度 l_P，层数通道计数加一</text>
    <line x1="300" y1="1206" x2="1380" y2="1206" stroke="rgba(245,197,66,0.35)" stroke-width="1.5" stroke-dasharray="6 6"/>

    <!-- 3 权重与传递 -->
    <circle cx="150" cy="1250" r="22" fill="none" stroke="#f5c542" stroke-width="2.5"/>
    <text x="150" y="1258" font-size="22" fill="#f5c542" font-weight="700" text-anchor="middle">3</text>
    <text x="196" y="1240" font-size="25" fill="#e5e7eb" font-weight="700">权重与传递：与突触同形的两件事</text>
    <text x="196" y="1266" font-size="14" fill="#94a3b8">权重写在实轴取向上，传递靠碰撞接力</text>

    <rect x="150" y="1306" width="660" height="290" rx="14" fill="rgba(245,197,66,0.05)" stroke="rgba(245,197,66,0.30)" stroke-width="1.5"/>
    <text x="180" y="1348" font-size="21" fill="#f5c542" font-weight="700">权重：实轴方向差 Δα</text>
    <circle cx="330" cy="1450" r="34" fill="none" stroke="#f5c542" stroke-width="2.2"/>
    <line x1="330" y1="1450" x2="330" y2="1416" stroke="#f5c542" stroke-width="2.6" stroke-linecap="round"/>
    <circle cx="330" cy="1450" r="3.5" fill="#f8fafc"/>
    <circle cx="470" cy="1450" r="34" fill="none" stroke="#f5c542" stroke-width="2.2"/>
    <line x1="470" y1="1450" x2="498" y2="1426" stroke="#f5c542" stroke-width="2.6" stroke-linecap="round"/>
    <circle cx="470" cy="1450" r="3.5" fill="#f8fafc"/>
    <path d="M 330 1400 A 62 62 0 0 1 476 1406" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="5 4"/>
    <text x="400" y="1394" font-size="13.5" fill="#38bdf8" font-weight="700" text-anchor="middle">Δα</text>
    <text x="180" y="1524" font-size="14" fill="#cbd5e1">相邻元相子的实轴取向差构成权重，可在外力下连续偏转</text>
    <text x="180" y="1550" font-size="13.5" fill="#94a3b8">方向差的空间梯度给出波矢，是模拟式权重</text>
    <text x="180" y="1576" font-size="13.5" fill="#94a3b8">读数取相对取向，单点绝对取向不可观测</text>

    <rect x="870" y="1306" width="660" height="290" rx="14" fill="rgba(56,189,248,0.05)" stroke="rgba(56,189,248,0.30)" stroke-width="1.5"/>
    <text x="900" y="1348" font-size="21" fill="#38bdf8" font-weight="700">传递：碰撞接力</text>
    <circle cx="1060" cy="1450" r="32" fill="none" stroke="#38bdf8" stroke-width="2.2"/>
    <circle cx="1124" cy="1450" r="32" fill="none" stroke="#38bdf8" stroke-width="2.2"/>
    <line x1="1060" y1="1450" x2="1060" y2="1420" stroke="#38bdf8" stroke-width="2.4" stroke-linecap="round"/>
    <line x1="1124" y1="1450" x2="1148" y2="1424" stroke="#38bdf8" stroke-width="2.4" stroke-linecap="round"/>
    <line x1="1160" y1="1450" x2="1290" y2="1450" stroke="#38bdf8" stroke-width="2.6" marker-end="url(#ar)" class="pulse"/>
    <text x="1230" y="1434" font-size="13" fill="#94a3b8" text-anchor="middle">下一格</text>
    <text x="900" y="1524" font-size="14" fill="#cbd5e1">圆心在公共边界重合碰撞，实轴方向被采样并完成移交</text>
    <text x="900" y="1550" font-size="13.5" fill="#94a3b8">整桶过手，不留副本：前向传播的一次信号传递</text>
    <text x="900" y="1576" font-size="13.5" fill="#94a3b8">一步一摆程，一格一格，前沿速度 c = l_P / t_P</text>

    <text x="840" y="1652" font-size="16" fill="#f8fafc" font-weight="600" text-anchor="middle">心侧：每次调整的方向由天行力给出；天行方程审计整段历史，给出兴衰指数 Ξ ∈ (-1,1)</text>
    <line x1="300" y1="1690" x2="1380" y2="1690" stroke="rgba(245,197,66,0.35)" stroke-width="1.5" stroke-dasharray="6 6"/>

    <!-- 4 三副面孔对照 -->
    <circle cx="150" cy="1752" r="22" fill="none" stroke="#38bdf8" stroke-width="2.5"/>
    <text x="150" y="1760" font-size="22" fill="#38bdf8" font-weight="700" text-anchor="middle">4</text>
    <text x="196" y="1742" font-size="25" fill="#e5e7eb" font-weight="700">三副面孔，各自一句话</text>
    <text x="196" y="1768" font-size="14" fill="#94a3b8">同一行说的是同一个功能，材料不同，骨架相同</text>

    <rect x="150" y="1808" width="440" height="190" rx="14" fill="rgba(245,197,66,0.05)" stroke="rgba(245,197,66,0.30)" stroke-width="1.5"/>
    <text x="180" y="1850" font-size="20" fill="#f5c542" font-weight="700">元相子</text>
    <text x="180" y="1890" font-size="14" fill="#cbd5e1">权重：实轴方向差 Δα</text>
    <text x="180" y="1920" font-size="14" fill="#cbd5e1">事件：法线跃迁 l_P</text>
    <text x="180" y="1950" font-size="13" fill="#94a3b8">触发：θ = 2πn</text>

    <rect x="590" y="1808" width="440" height="190" rx="14" fill="rgba(52,211,153,0.05)" stroke="rgba(52,211,153,0.30)" stroke-width="1.5"/>
    <text x="620" y="1850" font-size="20" fill="#34d399" font-weight="700">生物神经元</text>
    <text x="620" y="1890" font-size="14" fill="#cbd5e1">权重：突触连接强度</text>
    <text x="620" y="1920" font-size="14" fill="#cbd5e1">事件：动作电位</text>
    <text x="620" y="1950" font-size="13" fill="#94a3b8">触发：越过阈值</text>

    <rect x="1030" y="1808" width="440" height="190" rx="14" fill="rgba(56,189,248,0.05)" stroke="rgba(56,189,248,0.30)" stroke-width="1.5"/>
    <text x="1060" y="1850" font-size="20" fill="#38bdf8" font-weight="700">人工神经元</text>
    <text x="1060" y="1890" font-size="14" fill="#cbd5e1">权重：参数 wᵢ</text>
    <text x="1060" y="1920" font-size="14" fill="#cbd5e1">事件：激活输出 σ</text>
    <text x="1060" y="1950" font-size="13" fill="#94a3b8">触发：加权和加偏置</text>

    <text x="840" y="2060" font-size="16" fill="#f8fafc" font-weight="700" text-anchor="middle" letter-spacing="1">结构对应，严格程度低于数学同构</text>
    <text x="840" y="2088" font-size="13" fill="#94a3b8" text-anchor="middle">天行力被定位为网络框架的边界条件，不可几何化</text>

  </svg>
