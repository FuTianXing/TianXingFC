<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>给宇宙的整齐度造一把尺子 · 真空期望值</title>
<style>
  html,body { margin:0; padding:0; background:#060912; color:#e5e7eb;
        font-family:'Noto Sans SC','Microsoft YaHei',sans-serif; }
  .wrap { max-width:1720px; margin:0 auto; padding:28px 18px 60px; }
  .top { text-align:center; margin-bottom:26px; }
  .top h1 { font-size:30px; margin:0 0 8px; font-weight:800; color:#f8fafc; letter-spacing:2px; }
  .top p  { margin:0; font-size:14px; color:#94a3b8; letter-spacing:1px; }
  .svgbox { display:block; margin:0 auto; }
  .svgbox svg { display:block; width:100%; height:auto; }
  .foot { text-align:center; font-size:12px; color:#64748b; margin-top:22px; letter-spacing:1px; line-height:1.8; }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <h1>给宇宙的「整齐度」造一把尺子</h1>
    <p>真空期望值 · 从「局部合照」到「全国正步」· 粗粒化萃取算子</p>
  </div>

  <div class="svgbox">
  <svg xmlns="http://www.w3.org/2000/svg" width="1680" height="1960" viewBox="0 0 1680 1960" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif">

    <!-- 背景微网格 -->
    <defs>
      <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
        <path d="M 56 0 L 0 0 0 56" fill="none" stroke="rgba(148,163,184,0.05)" stroke-width="1"/>
      </pattern>
    </defs>
    <rect width="1680" height="1960" fill="url(#grid)"/>

    <!-- ================= 主标题 ================= -->
    <text x="840" y="86" font-size="52" fill="#f8fafc" font-weight="800" text-anchor="middle" letter-spacing="10">给宇宙的「整齐度」造一把尺子</text>
    <text x="840" y="136" font-size="22" fill="#94a3b8" text-anchor="middle" letter-spacing="4">真空期望值 &nbsp;·&nbsp; 从局部合照到全国正步 &nbsp;·&nbsp; 粗粒化萃取算子</text>
    <line x1="520" y1="168" x2="1160" y2="168" stroke="rgba(56,189,248,0.35)" stroke-width="2" stroke-linecap="round"/>

    <!-- ================= 幕 1：问题 ================= -->
    <circle cx="150" cy="240" r="22" fill="none" stroke="#38bdf8" stroke-width="2.5"/><text x="150" y="248" font-size="22" fill="#38bdf8" font-weight="700" text-anchor="middle">1</text>
    <text x="196" y="230" font-size="25" fill="#e5e7eb" font-weight="700">问题：为什么真空「黏稠度」= 246 GeV？</text>
    <text x="196" y="256" font-size="14" fill="#94a3b8">标准模型只说「就是这个数」，说不出为什么。</text>

    <!-- 左格：层级问题 -->
    <rect x="150" y="292" width="640" height="132" rx="14" fill="rgba(56,189,248,0.06)" stroke="rgba(56,189,248,0.30)" stroke-width="1.5"/>
    <text x="180" y="326" font-size="20" fill="#38bdf8" font-weight="700">层级问题（悬了几十年）</text>
    <text x="180" y="356" font-size="14" fill="#cbd5e1">$v$ 与普朗克标度分离到</text>
    <text x="180" y="382" font-size="16" fill="#f5c542" font-weight="700">v / E_P  ≈ 2 × 10⁻¹⁷</text>
    <text x="180" y="408" font-size="13.5" fill="#94a3b8">相差 17 个量级，标准模型无解释</text>

    <!-- 右格：缺口 -->
    <rect x="900" y="292" width="630" height="132" rx="14" fill="rgba(52,211,153,0.06)" stroke="rgba(52,211,153,0.30)" stroke-width="1.5"/>
    <text x="930" y="326" font-size="20" fill="#34d399" font-weight="700">真正的缺口：对齐度「没算法」</text>
    <text x="930" y="356" font-size="14" fill="#cbd5e1">天行新学说：$v$ 的本质 = 真空「方向对齐度」</text>
    <text x="930" y="382" font-size="14" fill="#cbd5e1">但这个量</text>
    <text x="930" y="408" font-size="15" fill="#f5c542" font-weight="700">只有名字，没有算法，算不出来</text>

    <!-- 幕1 底部：一句承接 -->
    <text x="840" y="472" font-size="17" fill="#f8fafc" font-weight="700" text-anchor="middle" letter-spacing="1">突破点：把「每一小片的齐」算成「整个宇宙的齐」的那台机器（粗粒化萃取算子）</text>
    <line x1="300" y1="498" x2="1380" y2="498" stroke="rgba(245,197,66,0.35)" stroke-width="1.5" stroke-dasharray="6 6"/>

    <!-- ================= 幕 2：两个层级 ================= -->
    <circle cx="150" cy="560" r="22" fill="none" stroke="#38bdf8" stroke-width="2.5"/><text x="150" y="568" font-size="22" fill="#38bdf8" font-weight="700" text-anchor="middle">2</text>
    <text x="196" y="550" font-size="25" fill="#e5e7eb" font-weight="700">两个层级：局部合照 vs 全国正步</text>
    <text x="196" y="576" font-size="14" fill="#94a3b8">先看「一小片齐不齐」，再看「全国齐不齐」。$v$ 取决于后者。</text>

    <!-- 左：微观 -->
    <rect x="150" y="612" width="640" height="250" rx="14" fill="rgba(56,189,248,0.05)" stroke="rgba(56,189,248,0.35)" stroke-width="1.5"/>
    <text x="180" y="650" font-size="21" fill="#38bdf8" font-weight="700">微观序参量 Ψᵃ</text>
    <text x="180" y="678" font-size="13.5" fill="#94a3b8">局部「合照」· 每一小片的整齐度</text>
    <!-- 一排小箭头，同向（齐） -->
    <g stroke="#38bdf8" stroke-width="3" stroke-linecap="round">
      <line x1="200" y1="740" x2="200" y2="780"/>
      <line x1="280" y1="740" x2="280" y2="780"/>
      <line x1="360" y1="740" x2="360" y2="780"/>
      <line x1="440" y1="740" x2="440" y2="780"/>
      <line x1="520" y1="740" x2="520" y2="780"/>
      <line x1="600" y1="740" x2="600" y2="780"/>
    </g>
    <text x="400" y="812" font-size="14" fill="#cbd5e1" text-anchor="middle">这一小片：挺齐的（只量这一片）</text>
    <text x="400" y="840" font-size="13" fill="#94a3b8" text-anchor="middle">在现场就能看出个大概</text>

    <!-- 右：宏观 -->
    <rect x="900" y="612" width="630" height="250" rx="14" fill="rgba(245,197,66,0.05)" stroke="rgba(245,197,66,0.30)" stroke-width="1.5"/>
    <text x="930" y="650" font-size="21" fill="#f5c542" font-weight="700">宏观序参量 D̃_global</text>
    <text x="930" y="678" font-size="13.5" fill="#94a3b8">全国「正步」· 整个宇宙的整齐度</text>
    <!-- 一列正步的人形 → 用一排原子 -->
    <g fill="rgba(245,197,66,0.85)">
      <circle cx="1010" cy="760" r="16"/>
      <circle cx="1080" cy="760" r="16"/>
      <circle cx="1150" cy="760" r="16"/>
      <circle cx="1220" cy="760" r="16"/>
      <circle cx="1290" cy="760" r="16"/>
      <circle cx="1360" cy="760" r="16"/>
    </g>
    <line x1="990" y1="800" x2="1380" y2="800" stroke="rgba(245,197,66,0.5)" stroke-width="3" stroke-linecap="round"/>
    <text x="1180" y="828" font-size="14" fill="#cbd5e1" text-anchor="middle">几十亿人合在一起，全国齐不齐？</text>
    <text x="1180" y="850" font-size="13" fill="#94a3b8" text-anchor="middle">没法靠眼看，得用一套统计</text>

    <!-- 幕2 底部：缺口箭头 -->
    <text x="840" y="908" font-size="16" fill="#f8fafc" font-weight="600" text-anchor="middle">中间缺一台「把局部照片合成全国整齐指数」的机器</text>
    <line x1="300" y1="934" x2="1380" y2="934" stroke="rgba(245,197,66,0.35)" stroke-width="1.5" stroke-dasharray="6 6"/>

    <!-- ================= 幕 3：萃取算子 ================= -->
    <circle cx="150" cy="1000" r="22" fill="none" stroke="#34d399" stroke-width="2.5"/><text x="150" y="1008" font-size="22" fill="#34d399" font-weight="700" text-anchor="middle">3</text>
    <text x="196" y="990" font-size="25" fill="#e5e7eb" font-weight="700">粗粒化萃取算子 F_rg：那台「合成机器」</text>
    <text x="196" y="1016" font-size="14" fill="#94a3b8">吃进一堆局部数字，吐出一个总数。</text>

    <!-- 公式框 -->
    <rect x="150" y="1052" width="1380" height="120" rx="14" fill="rgba(52,211,153,0.05)" stroke="rgba(52,211,153,0.35)" stroke-width="1.5"/>
    <text x="840" y="1105" font-size="26" fill="#e5e7eb" font-weight="700" text-anchor="middle">D̃_global &nbsp;=&nbsp; F_rg[ Ψᵃ ]</text>
    <text x="840" y="1148" font-size="15" fill="#94a3b8" text-anchor="middle">候选形式：把局部 Ψᵃ 在空间块 V 上求平均再取模</text>
    <text x="840" y="1162" font-size="13" fill="#64748b" text-anchor="middle">D̃_global = | (1/V) ∫_V Ψᵃ dV |（草图，需升级）</text>

    <line x1="300" y1="1198" x2="1380" y2="1198" stroke="rgba(245,197,66,0.35)" stroke-width="1.5" stroke-dasharray="6 6"/>

    <!-- ================= 幕 4：两个极端 ================= -->
    <circle cx="150" cy="1265" r="22" fill="none" stroke="#34d399" stroke-width="2.5"/><text x="150" y="1273" font-size="22" fill="#34d399" font-weight="700" text-anchor="middle">4</text>
    <text x="196" y="1255" font-size="25" fill="#e5e7eb" font-weight="700">两个极端：全乱 → 0，全齐 → 1</text>
    <text x="196" y="1281" font-size="14" fill="#94a3b8">这台机器靠两个「界」钉死：它不能把有序的对消当成全乱。</text>

    <!-- 左：随机界 -->
    <rect x="150" y="1318" width="640" height="240" rx="14" fill="rgba(56,189,248,0.05)" stroke="rgba(56,189,248,0.35)" stroke-width="1.5"/>
    <text x="180" y="1356" font-size="20" fill="#38bdf8" font-weight="700">随机界 → 0</text>
    <text x="180" y="1384" font-size="13.5" fill="#94a3b8">相位完全随机（各转各的）</text>
    <!-- 乱箭头 -->
    <g stroke="#38bdf8" stroke-width="2.6" stroke-linecap="round">
      <line x1="220" y1="1450" x2="200" y2="1440"/><line x1="300" y1="1450" x2="320" y2="1470"/>
      <line x1="360" y1="1450" x2="350" y2="1420"/><line x1="440" y1="1450" x2="460" y2="1430"/>
      <line x1="520" y1="1450" x2="510" y2="1480"/><line x1="600" y1="1450" x2="630" y2="1440"/>
      <line x1="680" y1="1450" x2="660" y2="1470"/><line x1="730" y1="1450" x2="740" y2="1480"/>
    </g>
    <text x="470" y="1520" font-size="14" fill="#cbd5e1" text-anchor="middle">D̃ ↓ 0 → v 下趋零（游牧真空，粒子没质量）</text>
    <text x="470" y="1548" font-size="12.5" fill="#94a3b8" text-anchor="middle">对称相</text>

    <!-- 右：锁定界 -->
    <rect x="900" y="1318" width="630" height="240" rx="14" fill="rgba(52,211,153,0.05)" stroke="rgba(52,211,153,0.35)" stroke-width="1.5"/>
    <text x="930" y="1356" font-size="20" fill="#34d399" font-weight="700">锁定界 → 1</text>
    <text x="930" y="1384" font-size="13.5" fill="#94a3b8">相位全局锁定（齐步走）</text>
    <!-- 齐箭头 -->
    <g stroke="#34d399" stroke-width="3" stroke-linecap="round">
      <line x1="970" y1="1450" x2="970" y2="1410"/><line x1="1050" y1="1450" x2="1050" y2="1410"/>
      <line x1="1130" y1="1450" x2="1130" y2="1410"/><line x1="1210" y1="1450" x2="1210" y2="1410"/>
      <line x1="1290" y1="1450" x2="1290" y2="1410"/><line x1="1370" y1="1450" x2="1370" y2="1410"/>
    </g>
    <text x="1180" y="1520" font-size="14" fill="#cbd5e1" text-anchor="middle">D̃ → 1 → v ≠ 0（定居真空，粒子有质量）</text>
    <text x="1180" y="1548" font-size="12.5" fill="#94a3b8" text-anchor="middle">破缺相</text>

    <!-- ================= 幕 5：关键裁决 ================= -->
    <circle cx="150" cy="1625" r="22" fill="none" stroke="#f5c542" stroke-width="2.5"/><text x="150" y="1633" font-size="22" fill="#f5c542" font-weight="700" text-anchor="middle">5</text>
    <text x="196" y="1615" font-size="25" fill="#e5e7eb" font-weight="700">关键裁决：这把尺子量「相干」，量「远处还连不连得上」</text>
    <text x="196" y="1641" font-size="14" fill="#94a3b8">因为 g₀ = lim G(x−y) ≠ 0：$v ∝ g₀$ 必须是「相干类」的量。</text>

    <rect x="150" y="1678" width="1380" height="140" rx="14" fill="rgba(245,197,66,0.05)" stroke="rgba(245,197,66,0.30)" stroke-width="1.5"/>
    <text x="200" y="1716" font-size="18" fill="#f5c542" font-weight="700">裁决结论</text>
    <text x="200" y="1750" font-size="14.5" fill="#cbd5e1">• 候选机器（相干类）方向对，但太粗糙，需升级成更精细的相干度量；</text>
    <text x="200" y="1778" font-size="14.5" fill="#cbd5e1">• 「熵」（只数方向分布乱不乱）只能当帮手、不能当主尺；</text>
    <text x="200" y="1806" font-size="14.5" fill="#cbd5e1">• 正主是关联函数（g₀ 长程极限 或 关联长度占比），重整化群留着做严格升级。</text>

    <!-- 结局收束 -->
    <line x1="300" y1="1846" x2="1380" y2="1846" stroke="rgba(245,197,66,0.35)" stroke-width="1.5" stroke-dasharray="6 6"/>
    <text x="840" y="1888" font-size="18" fill="#f8fafc" font-weight="700" text-anchor="middle" letter-spacing="1">它没有盖好房子，但把「图纸 + 施工路线 + 地基怎么打」都画出来了</text>
    <text x="840" y="1920" font-size="14" fill="#94a3b8" text-anchor="middle">内部草稿级攻坚 · 精确 246 GeV 仍待各链闭合</text>

  </svg>
  </div>

  <div class="foot">
    依据：《真空期望值的粗粒化萃取：从 DOGA 宏观序参量到 VEV》· 傅天行 · 天行新学研究院<br>
    配套科普：《怎样给整个宇宙的整齐度造一把尺子》
  </div>
</div>
</body>
</html>
