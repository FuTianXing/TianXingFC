    <text x="180" y="3066" font-size="14" fill="#cbd5e1">静态弱场：偏转 &#8594; 曲率源 &#8594; 泊松方程 &#8594; 四步到爱因斯坦方程（两侧同源）</text>

    <text x="840" y="3790" font-size="16.5" fill="#e5e7eb" font-weight="700" text-anchor="middle">时空是元相子束缚振荡的宏观统计几何：空间由法线离散跃迁逐格生成，时间由摆程计数给出并从几何定向获得箭头，</text>
