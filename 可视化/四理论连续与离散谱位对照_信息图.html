<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>四理论连续与离散谱位对照 · 元相子 / 弦论 / 圈量子引力 / 因果集</title>
<style>
  html,body { margin:0; padding:0; background:#060912; color:#e5e7eb;
        font-family:'Noto Sans SC','Microsoft YaHei',sans-serif; }
  .wrap { max-width:1720px; margin:0 auto; padding:28px 18px 60px; }
  .top { text-align:center; margin-bottom:26px; }
  .top h1 { font-size:30px; margin:0 0 8px; font-weight:800; color:#f8fafc; letter-spacing:2px; }
  .top p  { margin:0; font-size:14px; color:#94a3b8; letter-spacing:1px; }
  .svgbox { display:block; margin:0 auto; }
  .svgbox svg { display:block; width:100%; height:auto; }
  .foot { text-align:center; font-size:12px; color:#64748b; margin-top:22px; letter-spacing:1px; line-height:1.9; }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <h1>四理论在连续与离散轴上的谱位</h1>
    <p>元相子 · 弦论 · 圈量子引力 · 因果集 &nbsp;·&nbsp; 位置差异与离散性来源</p>
  </div>

  <div class="svgbox">
  <svg xmlns="http://www.w3.org/2000/svg" width="1680" height="1380" viewBox="0 0 1680 1380" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif">

    <defs>
      <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
        <path d="M 56 0 L 0 0 0 56" fill="none" stroke="rgba(148,163,184,0.05)" stroke-width="1"/>
      </pattern>
      <linearGradient id="axisGrad" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0%"   stop-color="#38bdf8" stop-opacity="0.85"/>
        <stop offset="50%"  stop-color="#a78bfa" stop-opacity="0.85"/>
        <stop offset="100%" stop-color="#f5c542" stop-opacity="0.85"/>
      </linearGradient>
      <linearGradient id="ysGrad" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0%"   stop-color="#38bdf8" stop-opacity="0.20"/>
        <stop offset="42%"  stop-color="#a78bfa" stop-opacity="0.22"/>
        <stop offset="58%"  stop-color="#a78bfa" stop-opacity="0.22"/>
        <stop offset="100%" stop-color="#f5c542" stop-opacity="0.20"/>
      </linearGradient>
      <marker id="arrowL" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto">
        <path d="M 10 0 L 0 5 L 10 10 z" fill="#64748b"/>
      </marker>
      <marker id="arrowR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
        <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
      </marker>
    </defs>
    <rect width="1680" height="1380" fill="url(#grid)"/>

    <!-- ================= 标题 ================= -->
    <text x="840" y="78" font-size="44" fill="#f8fafc" font-weight="800" text-anchor="middle" letter-spacing="6">四理论在连续与离散轴上的谱位</text>
    <text x="840" y="122" font-size="19" fill="#94a3b8" text-anchor="middle" letter-spacing="3">三家在轴上取点 &nbsp;·&nbsp; 元相子跨轴 &nbsp;·&nbsp; 分歧的落点在离散性从何而来</text>
    <line x1="560" y1="150" x2="1120" y2="150" stroke="rgba(167,139,250,0.40)" stroke-width="2" stroke-linecap="round"/>

    <!-- ================= 幕 1：主轴位置 ================= -->
    <circle cx="150" cy="228" r="22" fill="none" stroke="#a78bfa" stroke-width="2.5"/>
    <text x="150" y="236" font-size="22" fill="#a78bfa" font-weight="700" text-anchor="middle">1</text>
    <text x="196" y="220" font-size="25" fill="#e5e7eb" font-weight="700">主轴：连续 ↔ 离散，四者站在哪里</text>
    <text x="196" y="246" font-size="14" fill="#94a3b8">越靠左＝连续侧越基本；越靠右＝离散侧越基本；中段＝两侧同为基本层</text>

    <!-- 元相子跨轴带 -->
    <rect x="200" y="298" width="1280" height="46" rx="23" fill="url(#ysGrad)" stroke="rgba(167,139,250,0.55)" stroke-width="1.6"/>
    <text x="840" y="327" font-size="19" fill="#ddd6fe" font-weight="700" text-anchor="middle" letter-spacing="1">元相子：连续与离散同为本原，波主粒从（跨全轴，非单点）</text>
    <line x1="200"  y1="344" x2="200"  y2="404" stroke="rgba(167,139,250,0.55)" stroke-width="1.6" stroke-dasharray="5 5"/>
    <line x1="1480" y1="344" x2="1480" y2="404" stroke="rgba(167,139,250,0.55)" stroke-width="1.6" stroke-dasharray="5 5"/>

    <!-- 主轴 -->
    <line x1="210" y1="418" x2="1470" y2="418" stroke="url(#axisGrad)" stroke-width="4" stroke-linecap="round"/>
    <line x1="210" y1="418" x2="180" y2="418" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrowL)"/>
    <line x1="1470" y1="418" x2="1500" y2="418" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrowR)"/>
    <text x="178" y="452" font-size="14" fill="#7dd3fc" text-anchor="start" font-weight="700">连续为本原</text>
    <text x="1502" y="452" font-size="14" fill="#fcd34d" text-anchor="end" font-weight="700">离散为本原</text>
    <text x="840" y="452" font-size="13.5" fill="#a5b4fc" text-anchor="middle">平权（双本原）</text>

    <!-- 弦论 -->
    <circle cx="330" cy="418" r="14" fill="#0ea5e9" stroke="#7dd3fc" stroke-width="2.5"/>
    <text x="330" y="500" font-size="18" fill="#7dd3fc" font-weight="700" text-anchor="middle">弦论</text>
    <text x="330" y="524" font-size="13" fill="#cbd5e1" text-anchor="middle">无基本离散</text>
    <text x="330" y="544" font-size="13" fill="#94a3b8" text-anchor="middle">弦与世界面连续</text>

    <!-- 圈量子引力 -->
    <circle cx="1130" cy="418" r="14" fill="#059669" stroke="#6ee7b7" stroke-width="2.5"/>
    <text x="1130" y="500" font-size="18" fill="#6ee7b7" font-weight="700" text-anchor="middle">圈量子引力</text>
    <text x="1130" y="524" font-size="13" fill="#cbd5e1" text-anchor="middle">离散是量子化手续</text>
    <text x="1130" y="544" font-size="13" fill="#94a3b8" text-anchor="middle">连续是半经典极限</text>

    <!-- 因果集 -->
    <circle cx="1400" cy="418" r="14" fill="#d97706" stroke="#fcd34d" stroke-width="2.5"/>
    <text x="1400" y="500" font-size="18" fill="#fcd34d" font-weight="700" text-anchor="middle">因果集</text>
    <text x="1400" y="524" font-size="13" fill="#cbd5e1" text-anchor="middle">离散是本体公设</text>
    <text x="1400" y="544" font-size="13" fill="#94a3b8" text-anchor="middle">连续是统计近似</text>

    <!-- ================= 幕 2：离散性来源三级梯 ================= -->
    <circle cx="150" cy="632" r="22" fill="none" stroke="#6ee7b7" stroke-width="2.5"/>
    <text x="150" y="640" font-size="22" fill="#6ee7b7" font-weight="700" text-anchor="middle">2</text>
    <text x="196" y="624" font-size="25" fill="#e5e7eb" font-weight="700">离散性来源：同处离散侧，来源分三档</text>
    <text x="196" y="650" font-size="14" fill="#94a3b8">轴上的位置相近，离散从何而来却不同，这一格才是判别量</text>

    <!-- 档 1 -->
    <text x="200" y="690" font-size="15" fill="#c4b5fd" font-weight="700">① 本体层：离散是公设或动力学内生</text>
    <rect x="200" y="700" width="1280" height="60" rx="12" fill="rgba(167,139,250,0.07)" stroke="rgba(167,139,250,0.35)" stroke-width="1.4"/>
    <rect x="224" y="714" width="586" height="32" rx="16" fill="rgba(167,139,250,0.16)" stroke="rgba(196,181,253,0.55)" stroke-width="1.2"/>
    <text x="517" y="736" font-size="14.5" fill="#ddd6fe" text-anchor="middle">元相子：满周自耦合，离散从连续内部自生</text>
    <rect x="828" y="714" width="628" height="32" rx="16" fill="rgba(245,197,66,0.14)" stroke="rgba(252,211,77,0.55)" stroke-width="1.2"/>
    <text x="1142" y="736" font-size="14.5" fill="#fde68a" text-anchor="middle">因果集：局部有限因果偏序集（直接为公设）</text>

    <!-- 档 2 -->
    <text x="200" y="798" font-size="15" fill="#6ee7b7" font-weight="700">② 量子化手续层：离散是手续的产物</text>
    <rect x="200" y="808" width="1280" height="60" rx="12" fill="rgba(52,211,153,0.06)" stroke="rgba(52,211,153,0.32)" stroke-width="1.4"/>
    <rect x="224" y="822" width="760" height="32" rx="16" fill="rgba(52,211,153,0.15)" stroke="rgba(110,231,183,0.55)" stroke-width="1.2"/>
    <text x="604" y="844" font-size="14.5" fill="#a7f3d0" text-anchor="middle">圈量子引力：正则量子化后面积与体积算符谱离散（面积隙）</text>

    <!-- 档 3 -->
    <text x="200" y="906" font-size="15" fill="#7dd3fc" font-weight="700">③ 无基本离散：本体清单里没有格点</text>
    <rect x="200" y="916" width="1280" height="60" rx="12" fill="rgba(56,189,248,0.06)" stroke="rgba(56,189,248,0.32)" stroke-width="1.4"/>
    <rect x="224" y="930" width="820" height="32" rx="16" fill="rgba(56,189,248,0.15)" stroke="rgba(125,211,252,0.55)" stroke-width="1.2"/>
    <text x="634" y="952" font-size="14.5" fill="#bae6fd" text-anchor="middle">弦论：弦与世界面连续，离散只出现在紧致化与真空选择层面</text>

    <!-- ================= 幕 3：四维度矩阵 ================= -->
    <circle cx="150" cy="1040" r="22" fill="none" stroke="#f5c542" stroke-width="2.5"/>
    <text x="150" y="1048" font-size="22" fill="#f5c542" font-weight="700" text-anchor="middle">3</text>
    <text x="196" y="1032" font-size="25" fill="#e5e7eb" font-weight="700">四维度速览</text>
    <text x="196" y="1058" font-size="14" fill="#94a3b8">余下三维度并置：时空地位、公理数、可证伪预言的形态</text>

    <!-- 表头 -->
    <rect x="200" y="1080" width="1360" height="46" rx="8" fill="rgba(148,163,184,0.10)"/>
    <text x="440" y="1109" font-size="15" fill="#ddd6fe" font-weight="700" text-anchor="middle">元相子</text>
    <text x="720" y="1109" font-size="15" fill="#7dd3fc" font-weight="700" text-anchor="middle">弦论</text>
    <text x="1000" y="1109" font-size="15" fill="#6ee7b7" font-weight="700" text-anchor="middle">圈量子引力</text>
    <text x="1280" y="1109" font-size="15" fill="#fcd34d" font-weight="700" text-anchor="middle">因果集</text>

    <!-- 行 1：时空是否背景 -->
    <rect x="200" y="1126" width="1360" height="50" fill="rgba(148,163,184,0.035)"/>
    <text x="220" y="1156" font-size="14" fill="#cbd5e1" font-weight="700">时空是否背景</text>
    <text x="440" y="1156" font-size="13.5" fill="#e5e7eb" text-anchor="middle">非背景，晶格涌现</text>
    <text x="720" y="1156" font-size="13.5" fill="#e5e7eb" text-anchor="middle">背景流形（冲突）</text>
    <text x="1000" y="1156" font-size="13.5" fill="#e5e7eb" text-anchor="middle">背景独立</text>
    <text x="1280" y="1156" font-size="13.5" fill="#e5e7eb" text-anchor="middle">背景独立</text>

    <!-- 行 2：离散性来源 -->
    <rect x="200" y="1176" width="1360" height="50" fill="rgba(148,163,184,0.07)"/>
    <text x="220" y="1206" font-size="14" fill="#cbd5e1" font-weight="700">离散性来源</text>
    <text x="440" y="1206" font-size="13.5" fill="#ddd6fe" text-anchor="middle">动力学内生</text>
    <text x="720" y="1206" font-size="13.5" fill="#e5e7eb" text-anchor="middle">无基本离散</text>
    <text x="1000" y="1206" font-size="13.5" fill="#e5e7eb" text-anchor="middle">量子化手续</text>
    <text x="1280" y="1206" font-size="13.5" fill="#e5e7eb" text-anchor="middle">本体公设</text>

    <!-- 行 3：公理数 -->
    <rect x="200" y="1226" width="1360" height="50" fill="rgba(148,163,184,0.035)"/>
    <text x="220" y="1256" font-size="14" fill="#cbd5e1" font-weight="700">公理数</text>
    <text x="440" y="1256" font-size="13.5" fill="#e5e7eb" text-anchor="middle">1 条公理 + 3 条标度公设</text>
    <text x="720" y="1256" font-size="13.5" fill="#e5e7eb" text-anchor="middle">无有限清单</text>
    <text x="1000" y="1256" font-size="13.5" fill="#e5e7eb" text-anchor="middle">不新增，借 BI 参数</text>
    <text x="1280" y="1256" font-size="13.5" fill="#e5e7eb" text-anchor="middle">少，缺动力学公理</text>

    <!-- 行 4：可证伪预言 -->
    <rect x="200" y="1276" width="1360" height="50" fill="rgba(148,163,184,0.07)"/>
    <text x="220" y="1306" font-size="14" fill="#cbd5e1" font-weight="700">可证伪预言</text>
    <text x="440" y="1306" font-size="13.5" fill="#ddd6fe" text-anchor="middle">33 条（已定级 29 项）</text>
    <text x="720" y="1306" font-size="13.5" fill="#e5e7eb" text-anchor="middle">依赖真空选择</text>
    <text x="1000" y="1306" font-size="13.5" fill="#e5e7eb" text-anchor="middle">无直接实验通路</text>
    <text x="1280" y="1306" font-size="13.5" fill="#e5e7eb" text-anchor="middle">Λ 涨落与 swerves</text>

    <!-- 收束 -->
    <line x1="300" y1="1348" x2="1380" y2="1348" stroke="rgba(167,139,250,0.35)" stroke-width="1.5" stroke-dasharray="6 6"/>
    <text x="840" y="1372" font-size="16" fill="#f8fafc" font-weight="700" text-anchor="middle" letter-spacing="1">轴上取点者众，跨越全轴并给离散一个动力学来源的，只有元相子</text>

  </svg>
  </div>

  <div class="foot">
    依据：《对照-元相子与弦论、圈量子引力、因果集：时空观、离散性来源、公理数、可证伪预言四维对照》· 内部草稿级述评<br>
    口径：外部三侧为述评级，取公共综述结论；本图只标结构差异与判别通路，不新增科学断言
  </div>
</div>
</body>
</html>
