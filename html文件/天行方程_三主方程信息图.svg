<text x="1280" y="590" text-anchor="middle" font-family="Cambria Math, STIX Two Math, serif" font-size="72" font-weight="600" fill="#173f4a">Ξ(T) = tanh { Re [ ( ∫₀ᵀ 𝓦(t) ⊗ 𝓟(t) dt )² ] }</text>
