<text x="690" y="1050" text-anchor="middle" font-family="Cambria Math, STIX Two Math, serif" font-size="56" fill="#173f4a">𝓦(t) = eⁱΦ(t)</text>
<text x="690" y="1130" text-anchor="middle" font-family="Cambria Math, STIX Two Math, serif" font-size="42" fill="#b45b4e">Φ(t) = −ηπ ∫₀ᵗ ln D̃(τ) dτ</text>
