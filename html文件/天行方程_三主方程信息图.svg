<text x="1870" y="1070" text-anchor="middle" font-family="Cambria Math, STIX Two Math, serif" font-size="58" fill="#173f4a">𝓟(t) = √( Õ(t) G̃(t) / Ã(t) )</text>
<text x="1870" y="1160" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="25" fill="#7c6250">O 秩序、G 增长、A 异化共同决定现实承载强度</text>
